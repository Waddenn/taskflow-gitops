name: PSSI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  manifests:
    name: PSSI manifests (conftest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Installer conftest 0.71.1 avec somme SHA-256
        run: |
          curl --fail --location --silent --show-error https://github.com/open-policy-agent/conftest/releases/download/v0.71.1/conftest_0.71.1_Linux_x86_64.tar.gz -o conftest.tar.gz
          echo 'c3f6b2a753bd56e377a1e51a95ae3e057f926f2e9139f7d5b5dfbbaf810f7985  conftest.tar.gz' | sha256sum -c -
          tar xzf conftest.tar.gz conftest
          sudo mv conftest /usr/local/bin/conftest
      - name: Tester les règles puis les manifests (R1 à R4)
        run: |
          conftest verify --policy policies/
          conftest test apps/ --policy policies/
  images:
    name: PSSI images (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - name: Scanner les images déployées (R5)
        run: python scripts/pssi-images.py
      - name: Conserver les rapports, même en échec
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pssi-trivy
          path: reports/pssi/
          if-no-files-found: error
