# Le scénario de test de charge, exécuté par k6 pendant le canary.
# Les seuils (thresholds) traduisent notre exigence de robustesse :
#   - moins de 2 % de requêtes en erreur
#   - 95 % des réponses en moins de 250 ms
apiVersion: v1
kind: ConfigMap
metadata:
  name: k6-robustesse
data:
  robustesse.js: |
    import http from 'k6/http';
    import { check, sleep } from 'k6';

    export const options = {
      vus: 5,
      duration: '60s',
      noConnectionReuse: true,
      setupTimeout: '40s',
      thresholds: {
        http_req_failed: ['rate<0.02'],
        http_req_duration: ['p(95)<250'],
      },
    };

    const TARGET = __ENV.TARGET || 'http://taskflow-canary';

    // Attendre la convergence du Service avant de mesurer la nouvelle révision.
    export function setup() {
      const expected = __ENV.EXPECTED_HASH;
      if (!expected) return; // Charge manuelle sur le service principal.
      let consecutive = 0;
      for (let attempt = 0; attempt < 30; attempt++) {
        const response = http.get(`${TARGET}/health`, { timeout: '1s' });
        let pod = '';
        try { pod = response.json('pod') || ''; } catch (_) {}
        consecutive = response.status === 200 && pod.includes(`-${expected}-`)
          ? consecutive + 1 : 0;
        if (consecutive === 3) {
          console.log(`Cible vérifiée : ${pod}, hash attendu ${expected}`);
          return;
        }
        sleep(0.5);
      }
      throw new Error(`Le Service ne cible pas la révision attendue ${expected}`);
    }

    export default function () {
      const res = http.get(`${TARGET}/tasks`);
      check(res, { 'statut 200': (r) => r.status === 200 });
      sleep(0.2);
    }
